name: vdp_fast_hall_ac
description: Fast Van der Pauw AC sequence for long sweeps without full reciprocity coverage
contact_map: configs/contact_maps/vdp_4contacts_7709.yaml
defaults:
  source_mode: ac
  source_quantity: current
  source_channel: S1
  source: S1
  measure_channel: M1
  current_rms_a: 1.0e-5
  source_value: 1.0e-5
  frequency_hz: 13.7
  harmonic: 1
  measure_mode: lockin
  readout: x
  settle_s: 0.1
  repeats: 1
  reverse_policy: auto
  matrix_policy: apply_state
  lockin: true
steps:
  - name: ab_dc
    state: I_AB_V_DC
    outputs:
      M1:
        name: v_ab_dc_1w
        transform: lockin_x_over_current
    tags: [vdp, fast]
  - name: bc_ad
    state: I_BC_V_AD
    outputs:
      M1:
        name: v_bc_ad_1w
        transform: lockin_x_over_current
    tags: [vdp, fast, anisotropy]
  - name: ac_bd_hall_1
    state: I_AC_V_BD
    outputs:
      M1:
        name: v_ac_bd_1w
        transform: lockin_x_over_current
    measure_kind: hall_1
    tags: [vdp, fast, hall]
  - name: bd_ac_hall_2
    state: I_BD_V_AC
    outputs:
      M1:
        name: v_bd_ac_1w
        transform: lockin_x_over_current
    measure_kind: hall_2
    tags: [vdp, fast, hall]
