name: vdp_hall_with_drift_guard
description: Fast Van der Pauw Hall sequence with final drift reference repeat
contact_map: configs/contact_maps/vdp_4contacts_7709.yaml
defaults:
  source_mode: ac
  source_quantity: current
  source_channel: S1
  source: S1
  measure_channel: M1
  current_rms_a: 1.0e-5
  source_value: 1.0e-5
  frequency_hz: 13.7
  harmonic: 1
  measure_mode: lockin
  readout: x
  settle_s: 0.1
  repeats: 1
  reverse_policy: auto
  matrix_policy: apply_state
  lockin: true
steps:
  - name: ab_dc
    state: I_AB_V_DC
    tags: [vdp, longitudinal]
  - name: bc_ad
    state: I_BC_V_AD
    tags: [vdp, anisotropy]
  - name: ac_bd_hall_1
    state: I_AC_V_BD
    measure_kind: hall_1
    tags: [vdp, hall]
  - name: bd_ac_hall_2
    state: I_BD_V_AC
    measure_kind: hall_2
    tags: [vdp, hall]
  - name: ab_dc_drift_reference
    state: I_AB_V_DC
    repeat_of: ab_dc
    tags: [drift_guard, reference_repeat]
